name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Setup .NET SDKs
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          10.0.x

    - uses: jimver/cuda-toolkit@v0.2.35
      with:
        method: 'network'
      #  cuda: '12.1.0' # Specify the desired version
    
    - name: Verify CUDA Installation
      run: nvcc --version # Verify installation

    - name: Checkout MatX
      uses: actions/checkout@v6
      with:
        repository: NVIDIA/matx
        path: Native/MatX

    - name: Build MatX
      shell: bash
      run: |
        cd Native/MatX
        mkdir -p build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
        cmake --build . --config Release
        find .

    - name: Build
      shell: bash
      run: |
        dotnet restore
        dotnet build -c Release --no-restore
